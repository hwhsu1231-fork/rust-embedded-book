name: CI

on:
  push: # Run CI for all branches except GitHub merge queue tmp branches
    branches-ignore:
    - "gh-readonly-queue/**"
  pull_request: # Run CI for PRs on any branch
  merge_group: # Run CI for the GitHub merge queue
  workflow_dispatch:
    inputs:
      layout:
        description: 'Deployment layout'
        required: true
        type: choice
        default: 'full'
        options:
          - plain
          - multilang
          - multiversion
          - full
      version:
        description: 'Version name (used in multiversion / full modes)'
        required: false
        type: string
        default: 'master'

env:
  # Update the language picker in index.hbs to link new languages.
  MDBOOK_VERSION: 0.5.1
  MDBOOK_I18N_HELPERS_VERSION: 0.4.0
  # Deployment layout:  plain | multilang | multiversion | full
  DEPLOY_LAYOUT: ${{ inputs.layout || 'multilang' }}
  VERSION: ${{ inputs.version || 'master' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          pip3 install --user python-dateutil linkchecker
      - name: Put pip binary directory into path
        run: echo "~/.local/bin" >> $GITHUB_PATH

      # - name: Cache Cargo installed binaries
      #   uses: actions/cache@v4
      #   id: cache-cargo
      #   with:
      #     path: ~/cargo-bin
      #     key: cache-cargo
      # - name: Install mdbook
      #   if: steps.cache-cargo.outputs.cache-hit != 'true'
      #   uses: actions-rs/install@v0.1
      #   with:
      #     crate: mdbook
      #     version: latest

      - name: Update rustup
        run: rustup self update

      - name: Install Rust
        run: |
          rustup set profile minimal
          rustup toolchain install nightly -c rust-docs
          rustup default nightly

      - name: Install mdbook
        run: |
          cargo install mdbook --locked --version ${{ env.MDBOOK_VERSION }}

      - name: Install mdbook-i18n-helpers
        run: |
          cargo install mdbook-i18n-helpers --locked --version ${{ env.MDBOOK_I18N_HELPERS_VERSION }}

      # - name: Copy mdbook to cache directory
      #   if: steps.cache-cargo.outputs.cache-hit != 'true'
      #   run: |
      #     mkdir ~/cargo-bin
      #     cp ~/.cargo/bin/mdbook ~/cargo-bin
      # - name: Put new cargo binary directory into path
      #   run: echo "~/cargo-bin" >> $GITHUB_PATH

      - name: Download the .po files from localizethedocs/rust-embedded-book-l10n
        run: |
          git clone --branch po/master https://github.com/localizethedocs/rust-embedded-book-l10n.git po

      # - name: Build book
      #   run: mdbook build

      - name: Build all translations
        run: |
          case "${{ env.DEPLOY_LAYOUT }}" in
            plain)
              echo "::group::Building en_US (plain)"
              MDBOOK_BOOK__LANGUAGE=en_US mdbook build -d book/
              echo "::endgroup::"
              ;;
            multilang)
              for po_lang in $(jq -r '.languages[].code' languages.json); do
                echo "::group::Building $po_lang"
                langtag=$(jq -r --arg lang "$po_lang" '.languages[] | select(.code == $lang) | .langtag' languages.json)
                MDBOOK_BOOK__LANGUAGE=$po_lang mdbook build -d book/$langtag/
                echo "::endgroup::"
              done
              ;;
            multiversion)
              echo "::group::Building en_US / ${{ env.VERSION }}"
              MDBOOK_BOOK__LANGUAGE=en_US mdbook build -d book/${{ env.VERSION }}/
              echo "::endgroup::"
              ;;
            full)
              for po_lang in $(jq -r '.languages[].code' languages.json); do
                echo "::group::Building $po_lang / ${{ env.VERSION }}"
                langtag=$(jq -r --arg lang "$po_lang" '.languages[] | select(.code == $lang) | .langtag' languages.json)
                MDBOOK_BOOK__LANGUAGE=$po_lang mdbook build -d book/$langtag/${{ env.VERSION }}/
                echo "::endgroup::"
              done
              ;;
          esac

      # - name: Test book
      #   run: mdbook test
      # - name: Check links
      #   run: linkchecker book

      - name: Create root index.html redirect
        if: ${{ env.DEPLOY_LAYOUT != 'plain' }}
        run: |
          case "${{ env.DEPLOY_LAYOUT }}" in
            multilang)
              default_langtag=$(jq -r '.languages[] | select(.code == "en_US") | .langtag' languages.json)
              target="./${default_langtag}/"
              ;;
            multiversion)
              target="./${{ env.VERSION }}/"
              ;;
            full)
              default_langtag=$(jq -r '.languages[] | select(.code == "en_US") | .langtag' languages.json)
              target="./${default_langtag}/${{ env.VERSION }}/"
              ;;
          esac
          cat > book/index.html << EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=${target}" />
          </head>
          <body>
            <p>Redirecting to <a href="${target}">${target}</a></p>
          </body>
          </html>
          EOF

      - name: Copy metadata files to book root
        run: |
          case "${{ env.DEPLOY_LAYOUT }}" in
            multilang)             cp languages.json book/ ;;
            multiversion)          cp versions.json book/ ;;
            full)                  cp languages.json book/ && cp versions.json book/ ;;
          esac

      - name: Deploy book
        # if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/multilingual-with-localizethedocs' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: book
          force_orphan: true
